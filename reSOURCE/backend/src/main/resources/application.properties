spring.application.name=reSOURCE

# Load backend/.env (or the compose .env in the project root) when it exists.
# Real environment variables always win over these files.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# ---------- Server ----------
server.port=${SERVER_PORT:8080}

# ---------- PostgreSQL ----------
# All values are supplied through environment variables (see .env.example).
# The fallbacks are local development defaults that match docker-compose.yml.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:resource_db}
spring.datasource.username=${POSTGRES_USER:resource_user}
spring.datasource.password=${POSTGRES_PASSWORD:resource_pass}

# ---------- JPA ----------
# Flyway owns the schema, so Hibernate never generates or validates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Flyway ----------
# db/migration holds the portable migrations every engine can run (including the
# H2 used by the tests). SQL that only PostgreSQL understands lives outside that
# tree, in db/migration-postgresql, and is added through FLYWAY_LOCATIONS - see
# .env.example. Flyway scans subdirectories, so engine specific files must never
# sit inside db/migration itself.
spring.flyway.enabled=true
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

# ---------- JWT ----------
# JWT_SECRET has no default: the application refuses to start without it.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ---------- Photo storage ----------
# `local` keeps uploads in a directory on disk and serves them from
# app.storage.public-base-path. A hosted provider can be plugged in later by
# implementing PhotoStorageService and changing STORAGE_TYPE.
app.storage.type=${STORAGE_TYPE:local}
app.storage.local-directory=${STORAGE_LOCAL_DIR:uploads/spaces}
app.storage.public-base-path=${STORAGE_PUBLIC_PATH:/api/files/spaces}
app.storage.max-file-size-bytes=${STORAGE_MAX_FILE_BYTES:5242880}

# ---------- Demo data ----------
# Development only: seeds a demo owner and a few example spaces on startup.
app.seed.enabled=${SEED_DEMO_DATA:false}
app.seed.owner-email=${SEED_DEMO_EMAIL:demo@resource.local}
app.seed.owner-password=${SEED_DEMO_PASSWORD:DemoPass123}

# ---------- CORS ----------
# Comma separated list of origins allowed to call the API directly.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Optional comma separated origin patterns, for hosts that are not fixed
# (reverse proxies, tunnels, preview environments). Empty means: exact origins only.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}

# ---------- AI intelligence layer (Phase 6) ----------
# The one provider the AI features talk to. An OpenAI-compatible endpoint is
# expected, so switching gateway or model is a configuration change only.
# AI_API_KEY has no default: without it the AI endpoints answer with their
# fallback message and every manual path in the app keeps working. The key is
# used server-side only and is never sent to the browser.
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${AI_MODEL:gpt-4o-mini}

# Timeouts: an AI call may never hold a request thread indefinitely.
app.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:3000}
app.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:20000}
# A search is answered while someone waits: fail early and offer the filters.
app.ai.search-read-timeout-ms=${AI_SEARCH_READ_TIMEOUT_MS:8000}

# Image limits for material recognition (bytes, longest side accepted, longest side sent).
app.ai.max-image-bytes=${AI_MAX_IMAGE_BYTES:4194304}
app.ai.max-image-dimension=${AI_MAX_IMAGE_DIMENSION:8000}
app.ai.max-image-edge=${AI_MAX_IMAGE_EDGE:1024}

# Input and output caps for the text features.
app.ai.search-query-max-length=300
app.ai.extraction-text-max-length=1000
app.ai.description-max-length=1200

# Confidence bands used by the recognition card.
app.ai.confidence-high=${AI_CONFIDENCE_HIGH:0.80}
app.ai.confidence-medium=${AI_CONFIDENCE_MEDIUM:0.50}

# Abuse protection: calls per minute per client (search) and per user (listing tools).
app.ai.search-requests-per-minute=${AI_SEARCH_REQUESTS_PER_MINUTE:20}
app.ai.listing-requests-per-minute=${AI_LISTING_REQUESTS_PER_MINUTE:30}

# Identical search queries are answered from this cache instead of being billed twice.
app.ai.cache-ttl-seconds=${AI_CACHE_TTL_SECONDS:300}
app.ai.cache-max-entries=200
